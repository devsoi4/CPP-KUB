<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b8cff"/>
      <stop offset="1" stop-color="#3b46d6"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9763f"/>
      <stop offset="1" stop-color="#8f5328"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- ears -->
  <circle cx="140" cy="150" r="66" fill="#8f5328"/>
  <circle cx="372" cy="150" r="66" fill="#8f5328"/>
  <circle cx="140" cy="150" r="34" fill="#f2c9a0"/>
  <circle cx="372" cy="150" r="34" fill="#f2c9a0"/>
  <!-- head -->
  <ellipse cx="256" cy="282" rx="170" ry="152" fill="url(#fur)"/>
  <!-- muzzle -->
  <ellipse cx="256" cy="334" rx="84" ry="64" fill="#f5dcb8"/>
  <!-- cheeks -->
  <circle cx="156" cy="318" r="22" fill="#e58a6a" opacity=".45"/>
  <circle cx="356" cy="318" r="22" fill="#e58a6a" opacity=".45"/>
  <!-- eyes -->
  <circle cx="194" cy="262" r="20" fill="#25160f"/>
  <circle cx="318" cy="262" r="20" fill="#25160f"/>
  <circle cx="201" cy="254" r="7" fill="#fff"/>
  <circle cx="325" cy="254" r="7" fill="#fff"/>
  <!-- nose + mouth -->
  <ellipse cx="256" cy="310" rx="30" ry="21" fill="#25160f"/>
  <ellipse cx="248" cy="302" rx="9" ry="4.5" fill="#fff" opacity=".35"/>
  <path d="M256 330 V348 M256 348 Q238 370 218 354 M256 348 Q274 370 294 354"
